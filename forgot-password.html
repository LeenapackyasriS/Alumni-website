<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Anna University, Trichy Alumni Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<main class="auth-page">

    <section class="auth-card login-card">

        <!-- ======================================
             HEADER
        ======================================= -->

        <div class="auth-header">

            <img
                src="assets/logo.png"
                alt="Anna University Logo"
                class="auth-logo"
            >

            <h1 class="auth-title">
                Anna University, Trichy
            </h1>

            <div class="auth-subtitle">
                Alumni Portal
            </div>

        </div>


        <!-- ======================================
             ALERT
        ======================================= -->

        <div
            id="forgotAlert"
            class="auth-alert"
            role="alert"
            aria-live="polite"
        ></div>


        <!-- ======================================
             REQUEST FORM
        ======================================= -->

        <form
            id="forgotForm"
            class="auth-form"
            novalidate
        >

            <p class="step-description" style="margin-bottom:16px;">
                Enter the email address linked to your alumni account
                and we'll send you a link to reset your password.
            </p>

            <!-- EMAIL -->

            <div class="field">

                <svg
                    class="field-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-width="2"
                        d="M3 7l9 6 9-6M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"
                    />
                </svg>

                <input
                    type="email"
                    id="forgotEmail"
                    name="email"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn-primary"
            >
                Send Reset Link
            </button>

        </form>


        <!-- ======================================
             BACK TO LOGIN
        ======================================= -->

        <div class="auth-footer">

            Remembered your password?

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </section>

</main>


<script>

/* ==========================================================
   FORGOT PASSWORD
   DEMO ONLY — there is no backend/email service here.
   This just checks whether the email exists in the same
   localStorage "database" that register.js writes to, and
   shows a confirmation message. Replace with a real API
   call (and never reveal whether an email exists, in
   production) once a backend is available.
   ========================================================== */

document.addEventListener("DOMContentLoaded", () => {

    const form =
        document.getElementById("forgotForm");

    const alertBox =
        document.getElementById("forgotAlert");

    if (!form || !alertBox) return;


    function showAlert(message, type) {

        alertBox.textContent = message;

        alertBox.className =
            "auth-alert is-visible " + type;

    }


    function getStoredUsers() {

        try {

            const raw =
                localStorage.getItem("auAlumniUsers");

            const users =
                raw ? JSON.parse(raw) : [];

            return Array.isArray(users) ? users : [];

        } catch (err) {

            return [];

        }

    }


    form.addEventListener("submit", event => {

        event.preventDefault();

        const emailField =
            document.getElementById("forgotEmail");

        const email =
            emailField.value.trim();

        if (!email) {

            showAlert(
                "Enter your email address.",
                "error"
            );

            return;

        }

        /*
         * Same message whether or not the account exists,
         * so we don't leak which emails are registered.
         */

        showAlert(
            "If an account exists for " + email +
            ", a password reset link has been sent.",
            "success"
        );

        form.reset();

    });

});

</script>

</body>
</html>
