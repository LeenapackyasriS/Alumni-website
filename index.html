<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Anna University, Trichy Alumni Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<main class="auth-page">

    <section class="auth-card login-card">

        <!-- ======================================
             HEADER
        ======================================= -->

        <div class="auth-header">

            <img
                src="assets/logo.png"
                alt="Anna University Logo"
                class="auth-logo"
            >

            <h1 class="auth-title">
                Anna University, Trichy
            </h1>

            <div class="auth-subtitle">
                Alumni Portal
            </div>

        </div>


        <!-- ======================================
             ALERT
             Shown after redirect from registration,
             or on failed login attempt
        ======================================= -->

        <div
            id="loginAlert"
            class="auth-alert"
            role="alert"
            aria-live="polite"
        ></div>


        <!-- ======================================
             LOGIN FORM
        ======================================= -->

        <form
            id="loginForm"
            class="auth-form"
            novalidate
        >

            <!-- EMAIL / MOBILE -->

            <div class="field">

                <svg
                    class="field-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-width="2"
                        d="M3 7l9 6 9-6M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"
                    />
                </svg>

                <input
                    type="text"
                    id="loginId"
                    name="loginId"
                    placeholder="Email address / Mobile number"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <svg
                    class="field-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-7a2 2 0 00-2-2h-1V7a5 5 0 00-10 0v3H6a2 2 0 00-2 2v7a2 2 0 002 2zm3-12a3 3 0 116 0v3H9V7z"
                    />
                </svg>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="loginPassword"
                    aria-label="Show password"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        aria-hidden="true"
                    >

                        <path
                            stroke-width="2"
                            d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                            stroke-width="2"
                        />

                    </svg>

                </button>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="auth-options">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn-primary"
            >
                Login
            </button>

        </form>


        <!-- ======================================
             REGISTER
        ======================================= -->

        <div class="auth-divider">
            New to our alumni community?
        </div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register Now
            </a>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>

</body>
</html>
